name: Rick 3D Engine Android Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Rick3DEngine_V0.6/**"
      - ".github/workflows/rick-v6-android.yml"

concurrency:
  group: rick-3d-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Rick3DEngine_V0.6
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android Gradle Plugin 8.7.3 requires Gradle 8.9.
      - name: Set up compatible Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Check required Android project files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/rick/engine/MainActivity.kt
          test -f app/src/main/java/com/rick/engine/GridRenderer.kt
          echo "Required project files are present."

      - name: Build debug APK (retry temporary download failures)
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "Build attempt ${attempt}/3"
            set +e
            gradle --no-daemon --stacktrace --max-workers=2 assembleDebug 2>&1 | tee "${RUNNER_TEMP}/rick-build.log"
            build_status=${PIPESTATUS[0]}
            set -e
            if [ "${build_status}" -eq 0 ]; then exit 0; fi
            if [ "${attempt}" -lt 3 ] && grep -Eqi 'Read timed out|Could not GET|Could not download|UnknownHostException|Connection reset|Temporary failure in name resolution' "${RUNNER_TEMP}/rick-build.log"; then
              echo "Temporary dependency download failure; retrying in 20 seconds."
              sleep 20
              continue
            fi
            echo "Build failed. See Gradle output above."
            exit "${build_status}"
          done
          exit 1

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "${APK}"
          ls -lh "${APK}"
          echo "Debug APK was created successfully."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Rick-3D-Engine-V6-debug
          path: Rick3DEngine_V0.6/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
