name: Rick 3D Engine V6 Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "Rick3DEngine_V0.6/**"
      - ".github/workflows/rick-v6-android.yml"

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rick3DEngine_V0.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rick-3D-Engine-V6-debug
          path: Rick3DEngine_V0.6/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
